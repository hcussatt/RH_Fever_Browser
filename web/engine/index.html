<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading…</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1012;color:#eef2ef;font:14px system-ui}body{display:grid;place-items:center}main{width:min(100vw, calc((100vh - 48px)*854/480));position:relative}canvas{width:100%;display:block;aspect-ratio:854/480;background:#8cd4ed}footer{height:auto;min-height:42px;flex-wrap:wrap;display:flex;align-items:center;gap:18px;padding:0 12px;color:#aab4ae}button{font:inherit;color:inherit;background:#24312a;border:1px solid #53695b;border-radius:6px;padding:7px 16px;cursor:pointer}button:hover{background:#354b3d}#stage{position:relative}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#101912b8;gap:12px}#overlay[hidden]{display:none}h1{font-size:28px;margin:0}p{margin:0;color:#d2ded5}#status{margin-left:auto;font-variant-numeric:tabular-nums}#restart{padding:3px 10px}</style>
<main><div id="stage"><canvas width="854" height="480" aria-label="Game"></canvas><div id="overlay"><h1></h1><p class="controls">Space / X / click</p><button id="play" disabled>Loading…</button></div></div><footer><span class="controls">Space / X / click</span><button id="restart">Restart</button><button id="skip" hidden>Skip practice (Enter)</button><span id="status">Standalone PoC</span></footer></main>
<p style="position:fixed;top:8px;left:16px"><a href="../" style="color:inherit">← Library</a></p>
<script type="module" src="../engine/main.mjs"></script></html>
