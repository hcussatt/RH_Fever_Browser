<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading…</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1012;color:#eef2ef;font:14px system-ui}body{display:grid;place-items:center}main{width:min(100vw, calc((100vh - 48px)*854/480));position:relative}canvas{width:100%;display:block;aspect-ratio:854/480;background:#8cd4ed}footer{height:42px;display:flex;align-items:center;gap:18px;padding:0 12px;color:#aab4ae}button{font:inherit;color:inherit;background:#24312a;border:1px solid #53695b;border-radius:6px;padding:7px 16px;cursor:pointer}button:hover{background:#354b3d}#stage{position:relative}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#101912b8;gap:12px}#overlay[hidden]{display:none}h1{font-size:28px;margin:0}p{margin:0;color:#d2ded5}#status{margin-left:auto;font-variant-numeric:tabular-nums}#restart{padding:3px 10px}</style>
<style>
footer{height:auto;min-height:42px;flex-wrap:wrap;gap:8px}dialog{background:#14221c;color:#eef2ef;border:1px solid #627d6d;border-radius:14px;width:min(580px,94vw);max-height:90vh;padding:24px;overflow:auto}dialog::backdrop{background:#000b}dialog p{margin:14px 0;line-height:1.5}dialog h2{margin:0;font-size:22px}.versus-heading,.versus-actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.versus-actions{justify-content:flex-start;margin:14px 0;flex-wrap:wrap}dialog label{display:block;margin:12px 0}dialog textarea,dialog input{display:block;width:100%;margin-top:6px;background:#0d1511;border:1px solid #627d6d;border-radius:6px;color:#fff;padding:9px;font:inherit}dialog textarea{font:12px monospace;resize:vertical}dialog small{color:#aab4ae}body[data-multiplayer=true] main{width:min(100vw, calc((100vh - 165px)*854/480))}#versus-card{position:relative;margin-bottom:8px;width:100%;padding:12px;background:#14221cef;border:1px solid #627d6d;border-radius:10px;z-index:2;transition:background .15s}#versus-card span{display:block;margin:5px 0;font-variant-numeric:tabular-nums}#versus-card button{padding:3px 8px}#versus-card[data-pulse=hit]{background:#215e3e}#versus-card[data-pulse=miss]{background:#783b35}[hidden]{display:none!important}
</style>

<main><div id="stage"><canvas width="854" height="480" aria-label="Game"></canvas><div id="overlay"><h1></h1><p class="controls">Space / X / click</p><button id="play" disabled>Loading…</button></div></div><footer><span class="controls">Space / X / click</span><button id="restart">Restart</button><span id="status">Standalone PoC</span></footer></main>
<p style="position:fixed;top:8px;left:16px"><a href="../" style="color:inherit">← Library</a></p>
<script type="module" src="../engine/main.mjs"></script></html>
