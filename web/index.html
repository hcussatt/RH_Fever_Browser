<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Heaven Fever web</title>
<style>html,body{margin:0;min-height:100%;background:#0d1012;color:#eef2ef;font:16px system-ui}body{box-sizing:border-box;min-height:100vh;padding:24px 16px;display:grid;align-content:start;justify-content:center;gap:16px;text-align:center}nav{display:grid;gap:16px}h2{margin:12px 0 0;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9fb3a5}a{display:block;padding:14px 28px;border:1px solid #53695b;border-radius:8px;background:#24312a;color:inherit;text-decoration:none}a:hover{background:#354b3d}</style>
<h1>Rhythm Heaven Fever</h1><nav id="games"></nav>
<script type="module">
// games.json lists every game the build produced (tools/stage-index.sh), shown by remix set.
import {groupGames} from './engine/menu.mjs';
const nav=document.querySelector('#games');
for(const group of groupGames(await (await fetch('games.json')).json())){
 const h=document.createElement('h2');h.textContent=group.title;nav.append(h);
 for(const {id,title} of group.games){const a=document.createElement('a');a.href=id+'/';a.textContent=title;nav.append(a);}
}
</script></html>
