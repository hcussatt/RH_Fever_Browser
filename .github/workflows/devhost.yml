name: Deploy dev host

# Publishes devhost/ (the owner's private, key-gated game file host) to Cloudflare Workers with
# an R2 bucket. It skips until the repo has CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# RHF_DEV_KEY and RHF_UPLOAD_KEY secrets; see docs/dev-host.md. No game files pass through Actions.
on:
  push:
    branches: [main]
    paths: ['devhost/**', '.github/workflows/devhost.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.RHF_DEV_KEY != '' && secrets.RHF_UPLOAD_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without secrets
        if: env.READY != 'true'
        run: echo "::notice::Cloudflare or dev host key secrets are not set; dev host not deployed."
      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: '22'
      - name: Test dev host
        if: env.READY == 'true'
        run: node --test tests/devhost.test.mjs
      - name: Deploy to Cloudflare Workers
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          DEV_KEY: ${{ secrets.RHF_DEV_KEY }}
          UPLOAD_KEY: ${{ secrets.RHF_UPLOAD_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: devhost
          # Creates the private bucket on the first run; later runs find it already there.
          preCommands: npx wrangler r2 bucket create rhf-dev-files || true
          secrets: |
            DEV_KEY
            UPLOAD_KEY
