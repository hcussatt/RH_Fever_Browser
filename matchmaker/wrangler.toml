# Deployed by .github/workflows/matchmaker.yml once the repo has CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets. Runs on the Workers free plan (SQLite-backed Durable Objects).
name = "rhf-matchmaker"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Sites allowed to use the matchmaker (comma-separated). localhost and 127.0.0.1 are always allowed.
ALLOWED_ORIGINS = "https://hcussatt.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
